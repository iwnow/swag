# Локальная разработка. Порты публикуются только на 127.0.0.1.
name: swag

services:
  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.15.1-alpine3.22
    command: ['--jetstream', '--store_dir', '/data', '--http_port', '8222']
    ports:
      - 127.0.0.1:4222:4222
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz?js-enabled-only=true']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - 127.0.0.1:${API_PORT}:${API_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:$$API_PORT/health"']
      interval: 2s
      timeout: 3s
      retries: 30

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    env_file: .env
    ports:
      - 127.0.0.1:${ORCHESTRATOR_PORT}:${ORCHESTRATOR_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:$$ORCHESTRATOR_PORT/health"']
      interval: 2s
      timeout: 3s
      retries: 30

  # Не запускается в `npm run up`: образ агента для песочниц, собирается `docker compose build agent`.
  agent:
    profiles: [agent]
    image: swag-agent:dev
    build:
      context: .
      dockerfile: apps/agent/Dockerfile

volumes:
  postgres-data:
  nats-data:
