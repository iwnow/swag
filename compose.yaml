# Локальная разработка. Порты публикуются только на 127.0.0.1.
name: swag

services:
  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.15.1-alpine3.22
    command: ['--jetstream', '--store_dir', '/data', '--http_port', '8222']
    ports:
      - 127.0.0.1:4222:4222
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz?js-enabled-only=true']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - 127.0.0.1:${API_PORT}:${API_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:$$API_PORT/health"']
      interval: 2s
      timeout: 3s
      retries: 30

  # Доступ к Docker есть только у оркестратора (Q-1): песочницы агентов создаёт он.
  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Сокет на хосте принадлежит группе docker/root; пользователь node без этой группы получает EACCES.
    group_add:
      - '0'
    # Порт не публикуется: оркестратор — внутренний сервис, к нему ходит только `api` по сети compose (Q-7 спеки 001).
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:$$ORCHESTRATOR_PORT/health"']
      interval: 2s
      timeout: 3s
      retries: 30

  # Личный кабинет: `ng serve` с прокси /api → api (Q-4). Только для разработки.
  ui:
    build:
      context: .
      dockerfile: apps/ui/cabinet/Dockerfile
    ports:
      - 127.0.0.1:${UI_PORT}:4200
    depends_on:
      api:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:4200/" > /dev/null']
      interval: 2s
      timeout: 3s
      retries: 60

  # Спека 016, 4.9: сервисы и агенты шлют OTLP только сюда. Порты не публикуются:
  # OTLP HTTP 4318 и health_check 13133 доступны только в сети compose.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      lgtm:
        condition: service_started

  # Tempo (трейсы), Loki (логи) и Grafana в одном контейнере; источники данных и связь «лог ↔ трейс»
  # настроены образом. Наружу — только Grafana и только на 127.0.0.1 (входа нет до 012/014).
  # Grafana на подпути /grafana: ссылка «Трейс» из UI идёт через прокси ng serve (Q-6).
  lgtm:
    image: grafana/otel-lgtm:0.37.0
    environment:
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(http_port)s/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    ports:
      - 127.0.0.1:${GRAFANA_PORT}:3000
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/ready']
      interval: 2s
      timeout: 3s
      retries: 90

  # Не запускается в `npm run up`: образ агента для песочниц, собирается `npm run agent:image`.
  agent:
    profiles: [agent]
    image: swag-agent:dev
    build:
      context: .
      dockerfile: apps/agent/Dockerfile

volumes:
  postgres-data:
  nats-data:
  lgtm-data:
