# Локальная разработка. Порты публикуются только на 127.0.0.1.
name: swag

# Спека 002, 4.8: сеть `llm` — выход LiteLLM к провайдерам; `litellm` и `llm-fake` в ней одни, их не видно из default.
networks:
  llm:

services:
  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.15.1-alpine3.22
    command: ['--jetstream', '--store_dir', '/data', '--http_port', '8222']
    ports:
      - 127.0.0.1:4222:4222
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz?js-enabled-only=true']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Спека 001, 4.9 и 016, 4.11: только переменные, которые читает конфиг api (`ApiConfig`, `BaseConfig`).
    # Весь .env не передаётся: в нём лежат ключи dev-инструментов (D-73). Значения — из .env через интерполяцию.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL}
      API_PORT: ${API_PORT}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL}
      MAX_ACTIVE_SWARMS: ${MAX_ACTIVE_SWARMS}
      SWARM_MAX_BUDGET_MICRO_USD: ${SWARM_MAX_BUDGET_MICRO_USD}
      AGENT_MAX_TOKENS_LIMIT: ${AGENT_MAX_TOKENS_LIMIT}
      # Спека 013, 4.10: предел одного пополнения баланса организации.
      BALANCE_MAX_TOPUP_MICRO_USD: ${BALANCE_MAX_TOPUP_MICRO_USD:-100000000}
      # Спека 024, 4.14: проверка токенов и отзывов (identity), токен для вызова оркестратора.
      IDENTITY_URL: ${IDENTITY_URL}
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN}
      IDENTITY_JWT_PUBLIC_KEY: ${IDENTITY_JWT_PUBLIC_KEY}
      IDENTITY_JWT_KID: ${IDENTITY_JWT_KID}
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN}
      API_REVOCATION_POLL_MS: ${API_REVOCATION_POLL_MS:-5000}
      API_REVOCATION_MAX_STALE_MS: ${API_REVOCATION_MAX_STALE_MS:-30000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEMETRY_FLUSH_TIMEOUT_MS: ${TELEMETRY_FLUSH_TIMEOUT_MS:-2000}
    ports:
      - 127.0.0.1:${API_PORT}:${API_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      identity:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:$$API_PORT/health"']
      interval: 2s
      timeout: 3s
      retries: 30

  # Спека 012, 4.11: регистрация, вход и токены. Почта — mailpit (dev), порт наружу только на 127.0.0.1.
  # Переменные — только те, что читает конфиг identity (`IdentityConfig`).
  identity:
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEMETRY_FLUSH_TIMEOUT_MS: ${TELEMETRY_FLUSH_TIMEOUT_MS:-2000}
      IDENTITY_PORT: ${IDENTITY_PORT}
      IDENTITY_CONFIRM_URL: ${IDENTITY_CONFIRM_URL}
      IDENTITY_JWT_PRIVATE_KEY: ${IDENTITY_JWT_PRIVATE_KEY}
      IDENTITY_JWT_KID: ${IDENTITY_JWT_KID}
      IDENTITY_ACCESS_TTL_S: ${IDENTITY_ACCESS_TTL_S:-900}
      IDENTITY_REFRESH_TTL_S: ${IDENTITY_REFRESH_TTL_S:-2592000}
      IDENTITY_CONFIRM_TTL_S: ${IDENTITY_CONFIRM_TTL_S:-86400}
      IDENTITY_COOKIE_SECURE: ${IDENTITY_COOKIE_SECURE}
      IDENTITY_BODY_LIMIT_BYTES: ${IDENTITY_BODY_LIMIT_BYTES:-16384}
      IDENTITY_SUPERVISOR_EMAIL: ${IDENTITY_SUPERVISOR_EMAIL:-}
      IDENTITY_SUPERVISOR_PASSWORD: ${IDENTITY_SUPERVISOR_PASSWORD:-}
      SMTP_URL: ${SMTP_URL}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      MAIL_FROM: ${MAIL_FROM}
      # Спека 024, 4.14: токен отзывов для api, страница приглашения и срок приглашения.
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN}
      IDENTITY_INVITE_URL: ${IDENTITY_INVITE_URL}
      IDENTITY_INVITE_TTL_S: ${IDENTITY_INVITE_TTL_S:-604800}
    ports:
      - 127.0.0.1:${IDENTITY_PORT}:${IDENTITY_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:$$IDENTITY_PORT/health"']
      interval: 2s
      timeout: 3s
      retries: 30

  # Спека 012, 4.11: SMTP для identity (порт 1025) и UI/API писем (8025). Письма живут до перезапуска — без volume.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:${MAILPIT_UI_PORT}:8025

  # Доступ к Docker есть только у оркестратора (Q-1): песочницы агентов создаёт он.
  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    # Спека 001, 4.9 и 016, 4.11: только переменные, которые читает конфиг оркестратора (`OrchestratorConfig`, `BaseConfig`).
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL}
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT}
      AGENT_TEMPLATE: ${AGENT_TEMPLATE}
      DOCKER_AGENT_NETWORK: ${DOCKER_AGENT_NETWORK}
      DOCKER_AGENT_NATS_URL: ${DOCKER_AGENT_NATS_URL}
      DOCKER_AGENT_OTLP_ENDPOINT: ${DOCKER_AGENT_OTLP_ENDPOINT:-}
      # Спека 022, 4.8: лимиты агента, адрес и общий токен llm-gateway.
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS}
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN}
      DOCKER_AGENT_LLM_GATEWAY_URL: ${DOCKER_AGENT_LLM_GATEWAY_URL}
      # Спека 004, 4.11: внутренний API gateway для регистрации роёв (`LlmSwarms`).
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL}
      AGENT_START_TIMEOUT_MS: ${AGENT_START_TIMEOUT_MS}
      SWARM_TIMEOUT_MS: ${SWARM_TIMEOUT_MS}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEMETRY_FLUSH_TIMEOUT_MS: ${TELEMETRY_FLUSH_TIMEOUT_MS:-2000}
      # Спека 024, 4.13–4.14: Bearer-токен, который проверяет оркестратор.
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Сокет на хосте принадлежит группе docker/root; пользователь node без этой группы получает EACCES.
    group_add:
      - '0'
    # Порт не публикуется: оркестратор — внутренний сервис, к нему ходит только `api` по сети compose (Q-7 спеки 001).
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:$$ORCHESTRATOR_PORT/health"']
      interval: 2s
      timeout: 3s
      retries: 30

  # Спека 014, 4.9: каркас фронтенда — `ng serve` с прокси /api, /auth, /grafana и /mf/* (Q-4). Только для разработки.
  ui:
    build:
      context: .
      dockerfile: apps/ui/shell/Dockerfile
    ports:
      - 127.0.0.1:${UI_PORT}:4200
    depends_on:
      api:
        condition: service_healthy
      identity:
        condition: service_healthy
      ui-cabinet:
        condition: service_healthy
      ui-admin:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:4200/" > /dev/null']
      interval: 2s
      timeout: 3s
      retries: 60

  # Спека 014, 4.9: микрофронтенд кабинета (Native Federation remote). Порт не публикуется: к нему ходит только каркас через прокси /mf/cabinet.
  ui-cabinet:
    build:
      context: .
      dockerfile: apps/ui/cabinet/Dockerfile
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:4201/mf/cabinet/remoteEntry.json" > /dev/null']
      interval: 2s
      timeout: 3s
      retries: 60

  # Спека 014, 4.9: микрофронтенд администрирования (Native Federation remote). Порт не публикуется: к нему ходит только каркас через прокси /mf/admin.
  ui-admin:
    build:
      context: .
      dockerfile: apps/ui/admin/Dockerfile
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:4202/mf/admin/remoteEntry.json" > /dev/null']
      interval: 2s
      timeout: 3s
      retries: 60

  # Спека 016, 4.9: сервисы и агенты шлют OTLP только сюда. Порты не публикуются:
  # OTLP HTTP 4318 и health_check 13133 доступны только в сети compose.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      lgtm:
        condition: service_started

  # Tempo (трейсы), Loki (логи) и Grafana в одном контейнере; источники данных и связь «лог ↔ трейс»
  # настроены образом. Наружу — только Grafana и только на 127.0.0.1 (входа нет до 012/014).
  # Grafana на подпути /grafana: ссылка «Трейс» из UI идёт через прокси ng serve (Q-6).
  # Спека 003, 4.7: срок хранения Loki, Tempo и Prometheus — TELEMETRY_RETENTION из .env; конфиги Loki и Tempo — из infra/lgtm.
  lgtm:
    image: grafana/otel-lgtm:0.37.0
    environment:
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(http_port)s/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      TELEMETRY_RETENTION: ${TELEMETRY_RETENTION}
      LOKI_EXTRA_ARGS: '-config.expand-env=true'
      TEMPO_EXTRA_ARGS: '-config.expand-env=true'
      PROMETHEUS_EXTRA_ARGS: '--storage.tsdb.retention.time=${TELEMETRY_RETENTION}'
    ports:
      - 127.0.0.1:${GRAFANA_PORT}:3000
    volumes:
      - lgtm-data:/data
      - ./infra/lgtm/loki-config.yaml:/otel-lgtm/loki-config.yaml:ro
      - ./infra/lgtm/tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/ready']
      interval: 2s
      timeout: 3s
      retries: 90

  # Спека 002, 4.8: LiteLLM — единственный выход к провайдерам. Ключи — из .env.llm, порта наружу нет.
  # Профиль (test, dev, test-pay, prod) выбирает LLM_PROFILE из .env: конфиг моделей монтируется по нему.
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable.patch.3
    command: ['--config', '/app/config.yaml', '--port', '4000']
    env_file: .env.llm
    networks:
      - llm
    volumes:
      - ./infra/llm/${LLM_PROFILE}/litellm.yaml:/app/config.yaml:ro
    depends_on:
      llm-fake:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')",
        ]
      interval: 2s
      timeout: 3s
      retries: 60

  # Фейковый провайдер (спека 002, 4.12): профиль test. Node 24 запускает server.ts со снятием типов.
  llm-fake:
    image: node:24.22.1-alpine3.23
    command: ['node', '/app/server.ts']
    environment:
      FAKE_PROVIDER_PORT: 4010
    networks:
      - llm
    volumes:
      - ./infra/llm/fake-provider:/app:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:$$FAKE_PROVIDER_PORT/v1/models" > /dev/null']
      interval: 2s
      timeout: 3s
      retries: 30

  # Спека 002, 4.8: вход для роёв и агентов; сеть default для api и песочниц, llm — к LiteLLM.
  llm-gateway:
    build:
      context: .
      dockerfile: apps/llm-gateway/Dockerfile
    env_file:
      - .env
      - .env.llm
    environment:
      # Спека 004, 4.11: бюджеты, ledger и цены — в Postgres.
      DATABASE_URL: ${DATABASE_URL}
      LLM_CATALOG_PATH: /etc/swag/models.json
      # Спека 013, 4.10: ожидание идущих вызовов при закрытии роя.
      LLM_GATEWAY_CLOSE_WAIT_MS: ${LLM_GATEWAY_CLOSE_WAIT_MS:-5000}
    ports:
      - 127.0.0.1:${LLM_GATEWAY_PORT}:${LLM_GATEWAY_PORT}
    networks:
      - default
      - llm
    volumes:
      - ./infra/llm/${LLM_PROFILE}/models.json:/etc/swag/models.json:ro
    depends_on:
      litellm:
        condition: service_healthy
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:$$LLM_GATEWAY_PORT/health" > /dev/null']
      interval: 2s
      timeout: 3s
      retries: 30

  # Не запускается в `npm run up`: образ агента для песочниц, собирается `npm run agent:image`.
  agent:
    profiles: [agent]
    image: swag-agent:dev
    build:
      context: .
      dockerfile: apps/agent/Dockerfile

volumes:
  postgres-data:
  nats-data:
  lgtm-data:
