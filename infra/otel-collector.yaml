# OpenTelemetry Collector (спека 016, 4.9): сервисы и агенты шлют OTLP только сюда,
# Collector отправляет трейсы и логи в lgtm (Tempo, Loki). Смена бэкенда — правка этого файла.
extensions:
  # Проверка живости для infra:check: GET http://otel-collector:13133/ изнутри сети compose.
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlphttp/lgtm:
    endpoint: http://lgtm:4318

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/lgtm]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/lgtm]
