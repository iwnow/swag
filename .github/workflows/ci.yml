name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Сервис NATS для теста адаптера шины (AC-001-21, NATS_TEST_URL); Docker на раннере есть для AC-001-22.
    services:
      nats:
        image: nats:2.15.1-alpine3.22
        ports:
          - 4222:4222
    env:
      NATS_TEST_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
